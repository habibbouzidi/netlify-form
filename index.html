<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEN Home | Formulaire de Contact</title>
    <meta name="description"
        content="Rejoignez ZEN Home. Remplissez vos informations pour une ouverture rapide et personnalisée.">
    <link rel="icon" type="image/webp" href="zenhome.webp">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <div class="card" role="region" aria-label="Formulaire ZEN Home">

            <div class="header">
                <img src="zenhome.webp" alt="ZEN Home Logo" class="brand-logo">
                <h1>ZEN HOME</h1>
                <p>Découvrez une nouvelle expérience. Laissez-nous vos coordonnées et nous vous recontacterons.</p>
            </div>

            <form id="leadForm" name="zen-home-leads" method="POST" data-netlify="true" aria-describedby="form-desc"
                novalidate>

                <input type="hidden" name="form-name" value="zen-home-leads" />

                <p style="display:none">
                    <label>Bot field: <input name="bot-field" /></label>
                </p>

                <div class="form-grid">
                    <div class="field">
                        <input id="firstName" type="text" name="firstName" placeholder=" " required
                            autocomplete="given-name" />
                        <label for="firstName">Prénom</label>
                        <div class="error-msg" id="firstNameError" aria-live="polite"></div>
                    </div>

                    <div class="field">
                        <input id="lastName" type="text" name="lastName" placeholder=" " required
                            autocomplete="family-name" />
                        <label for="lastName">Nom</label>
                        <div class="error-msg" id="lastNameError" aria-live="polite"></div>
                    </div>

                    <div class="field full-width">
                        <input id="email" type="email" name="email" placeholder=" " required autocomplete="email" />
                        <label for="email">E-mail Professionnel</label>
                        <div class="error-msg" id="emailError" aria-live="polite"></div>
                    </div>

                    <div class="field">
                        <input id="phone" type="tel" name="phone" placeholder=" " autocomplete="tel" />
                        <label for="phone">Téléphone</label>
                        <div class="error-msg" id="phoneError" aria-live="polite"></div>
                    </div>

                    <div class="field">
                        <input id="companyName" type="text" name="companyName" placeholder=" "
                            autocomplete="organization" />
                        <label for="companyName">Société</label>
                        <div class="error-msg" id="companyNameError" aria-live="polite"></div>
                    </div>

                    <div class="field full-width">
                        <input id="city" type="text" name="city" placeholder=" " autocomplete="address-level2" />
                        <label for="city">Ville / Localité</label>
                        <div class="error-msg" id="cityError" aria-live="polite"></div>
                    </div>

                    <div class="field full-width">
                        <textarea id="address" name="address" placeholder=" "></textarea>
                        <label for="address">Adresse</label>
                        <div class="error-msg" id="addressError" aria-live="polite"></div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="submitBtn">
                        <span>Envoyer ma demande</span>
                        <div class="spinner"></div>
                    </button>
                    <p class="helper-text">Vos données sont sécurisées et traitées avec soin.</p>
                </div>

            </form>

            <div class="success-container" id="successMsg">
                <div class="success-icon">✓</div>
                <h2>Demande Reçue !</h2>
                <p>Merci de votre intérêt pour ZEN Home. Un conseiller vous contactera très prochainement.</p>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById("leadForm");
        const submitBtn = document.getElementById("submitBtn");
        const successMsg = document.getElementById("successMsg");

        function showErrors(errors) {
            // Reset all errors
            document.querySelectorAll('.error-msg').forEach(el => {
                el.textContent = '';
                el.classList.remove('visible');
            });
            document.querySelectorAll('.field').forEach(el => el.classList.remove('has-error'));

            // Show specific errors
            Object.keys(errors).forEach(key => {
                const errorEl = document.getElementById(key + 'Error');
                if (errorEl) {
                    errorEl.textContent = errors[key];
                    errorEl.classList.add('visible');
                    errorEl.closest('.field').classList.add('has-error');
                }
            });
        }

        function validate() {
            const errors = {};
            const first = document.getElementById('firstName').value.trim();
            const last = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!first) errors.firstName = 'Le prénom est requis';
            if (!last) errors.lastName = 'Le nom est requis';
            if (!email) {
                errors.email = 'L\'e-mail est requis';
            } else if (!/^\S+@\S+\.\S+$/.test(email)) {
                errors.email = 'Format d\'e-mail invalide';
            }

            showErrors(errors);
            return Object.keys(errors).length === 0;
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            if (!validate()) return;

            // Loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            const data = new FormData(form);

            fetch("/", {
                method: "POST",
                body: data
            })
                .then(() => {
                    form.style.display = "none";
                    successMsg.style.display = "block";
                    // Scroll to top of card if needed
                    successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                })
                .catch((err) => {
                    console.error(err);
                    alert("Une erreur est survenue. Veuillez réessayer ultérieurement.");
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                });
        });

        // Real-time validation on blur
        form.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('blur', () => {
                const fieldName = input.getAttribute('id');
                const errorEl = document.getElementById(fieldName + 'Error');
                const fieldContainer = input.closest('.field');

                if (input.hasAttribute('required') && !input.value.trim()) {
                    errorEl.textContent = 'Ce champ est obligatoire';
                    errorEl.classList.add('visible');
                    fieldContainer.classList.add('has-error');
                } else {
                    // Clear error if valid
                    errorEl.textContent = '';
                    errorEl.classList.remove('visible');
                    fieldContainer.classList.remove('has-error');
                }
            });
        });
    </script>

</body>

</html>
